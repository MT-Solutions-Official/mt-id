<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{title}</title>
    <style>
        :root { color-scheme: light; }
        body { margin:0; background:#eef1f6; font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#0f172a; }
        .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
        .card { width:100%; max-width:440px; background:#fff; border-radius:24px; box-shadow:0 24px 60px rgba(15,23,42,.1); overflow:hidden; }
        .bar { height:6px; background:{accentColor}; }
        .content { padding:36px 32px 32px; }
        .badge { display:inline-block; padding:6px 10px; border-radius:999px; background:#f8fafc; color:{accentColor}; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
        h1 { margin:16px 0 12px; font-size:28px; letter-spacing:-.03em; }
        p { margin:0 0 14px; color:#475569; line-height:1.6; }
        .btn { display:inline-block; margin-top:8px; background:{accentColor}; color:#fff; text-decoration:none; padding:12px 20px; border-radius:12px; font-weight:700; }
        .muted { color:#94a3b8; font-size:13px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="bar"></div>
        <div class="content">
            <div class="badge">{badgeText}</div>
            <h1>{title}</h1>
            <p>{message}</p>
            {#if actionUrl}
            <a class="btn" href="{actionUrl}">{actionText}</a>
            {/if}
            {#if detail}
            <p class="muted">{detail}</p>
            {/if}
        </div>
    </div>
</div>
</body>
</html>
