<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Redefinir senha</title>
    <style>
        body { margin:0; background:#eef1f6; font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#0f172a; }
        .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
        .card { width:100%; max-width:440px; background:#fff; border-radius:24px; box-shadow:0 24px 60px rgba(15,23,42,.1); overflow:hidden; }
        .bar { height:6px; background:#c2410c; }
        .content { padding:36px 32px 32px; }
        .badge { display:inline-block; padding:6px 10px; border-radius:999px; background:#fff7ed; color:#c2410c; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
        h1 { margin:16px 0 12px; font-size:28px; letter-spacing:-.03em; }
        p { margin:0 0 18px; color:#475569; line-height:1.6; }
        label { display:block; margin:0 0 6px; font-size:13px; font-weight:650; color:#334155; }
        input { width:100%; box-sizing:border-box; margin:0 0 16px; padding:12px 14px; border:1px solid #dbe3ee; border-radius:12px; font-size:15px; }
        input:focus { outline:2px solid #fed7aa; border-color:#c2410c; }
        button { width:100%; border:0; background:#c2410c; color:#fff; padding:13px 16px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
        .error { margin:0 0 16px; padding:10px 12px; border-radius:12px; background:#fef2f2; color:#b91c1c; font-size:13px; }
        .muted { margin-top:16px; color:#94a3b8; font-size:12px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="bar"></div>
        <div class="content">
            <div class="badge">Segurança</div>
            <h1>Nova senha</h1>
            <p>Defina uma senha com no mínimo 8 caracteres, incluindo letra maiúscula, minúscula, número e caractere especial.</p>
            {#if error}
            <div class="error">{error}</div>
            {/if}
            <form method="post" action="{actionUrl}">
                <input type="hidden" name="token" value="{token}"/>
                <label for="newPassword">Nova senha</label>
                <input id="newPassword" name="newPassword" type="password" minlength="8" required autocomplete="new-password"/>
                <label for="confirmPassword">Confirmar senha</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"/>
                <button type="submit">Salvar nova senha</button>
            </form>
            <p class="muted">O link de redefinição expira por segurança. Se você não pediu esta alteração, feche esta página.</p>
        </div>
    </div>
</div>
</body>
</html>
