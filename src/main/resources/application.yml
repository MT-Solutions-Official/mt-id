quarkus:
  application:
    name: mt-id

  http:
    port: 8081
    cors:
      enabled: true
      origins:
        - ${APP_MT_ID_CORS_ORIGIN:http://localhost:3000}
      methods:
        - GET
        - POST
        - PUT
        - DELETE
      headers:
        - Content-Type
        - Authorization
        - Accept

  mongodb:
    connection-string: ${APP_MT_ID_MONGODB_ENDPOINT:mongodb://localhost:27017/}
    database: ${APP_MT_ID_MONGODB_DATABASE:mt-id}


  swagger-ui:
    title: MT ID API Documentation
    theme: muted
    try-it-out-enabled: true
    persist-authorization: true
    always-include: true
    path: /swagger-ui

  smallrye-openapi:
    info-title: MT ID API Documentation
    info-version: 1.0.0

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: ${APP_MT_ID_JWT_ISSUER:mt-id}

smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  mt:
    id:
      timezone: ${APP_MT_ID_TIMEZONE:America/Sao_Paulo}
      jwt:
        issuer: ${APP_MT_ID_JWT_ISSUER:mt-id}
      token:
        expiration:
          hours: ${APP_MT_ID_JWT_TOKEN_EXPIRATION_HOURS:24}