quarkus:
  application:
    name: mt-id

  http:
    port: 8081
    cors:
      enabled: false

  mongodb:
    connection-string: ${APP_MT_ID_MONGODB_ENDPOINT:mongodb+srv://matteusjackson_db_user:zYsexdyvg4UpSRAC@mt-id-db.gik0cx7.mongodb.net/}
    database: ${APP_MT_ID_MONGODB_DATABASE:mt-id}

  mailer:
    from: ${APP_MT_ID_MAILER_FROM:no-reply@mt-id.com}
    host: ${APP_MT_ID_MAILER_HOST:smtp.gmail.com}
    port: ${APP_MT_ID_MAILER_PORT:587}
    start-tls: REQUIRED
    login: REQUIRED
    auth-methods: DIGEST-MD5 CRAMSHA256 CRAMSHA1 CRAMMD5 PLAIN LOGIN
    username: ${APP_MT_ID_MAILER_USERNAME:}
    password: ${APP_MT_ID_MAILER_PASSWORD:}
    mock: ${APP_MT_ID_MAILER_MOCK:false}

  swagger-ui:
    title: MT ID API Documentation
    theme: muted
    try-it-out-enabled: true
    persist-authorization: true
    always-include: true
    path: /swagger-ui

  smallrye-openapi:
    info-title: MT ID API Documentation
    info-version: 1.0.0

  rest-client:
    google-tokeninfo:
      url: ${APP_GOOGLE_TOKENINFO_URL:https://oauth2.googleapis.com}
    viacep:
      url: ${APP_VIACEP_URL:https://viacep.com.br/ws}
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 10000
    kodepos:
      url: ${APP_KODEPOS_URL:https://kodepos.vercel.app}
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 10000
    zippopotam:
      url: ${APP_ZIPPOPOTAMUS_URL:http://api.zippopotam.us}
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 10000
    pwned-passwords:
      url: ${APP_PWNED_PASSWORDS_URL:https://api.pwnedpasswords.com}
      connect-timeout: 3000
      read-timeout: 3000

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: ${APP_MT_ID_JWT_ISSUER:mt-id}

smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:di5cbe8ni}
  api-key: ${CLOUDINARY_API_KEY:735658489191162}
  api-secret: ${CLOUDINARY_API_SECRET:GQEvr_ZhAjrhCfrMCP9HUo5WP2M}

app:
  mt:
    id:
      timezone: ${APP_MT_ID_TIMEZONE:America/Sao_Paulo}
      frontend:
        base-url: ${APP_MT_ID_FRONTEND_BASE_URL:http://localhost:3000}
      cors:
        platform-origin: ${APP_MT_ID_CORS_ORIGIN:http://localhost:3000}
        cache:
          ttl:
            seconds: ${APP_MT_ID_CORS_CACHE_TTL_SECONDS:60}
      http:
        trust-forwarded-headers: ${APP_MT_ID_TRUST_FORWARDED_HEADERS:true}
      account-status:
        cache:
          ttl:
            seconds: ${APP_MT_ID_ACCOUNT_STATUS_CACHE_TTL_SECONDS:30}
      base-url: ${APP_MT_ID_BASE_URL:http://localhost:8081}
      email:
        verification:
          token:
            ttl:
              minutes: ${APP_MT_ID_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:30}
        password:
          reset:
            token:
              ttl:
                minutes: ${APP_MT_ID_PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
      throttle:
        verification-send:
          max-attempts: ${APP_MT_ID_THROTTLE_VERIFICATION_SEND_MAX_ATTEMPTS:5}
          window:
            seconds: ${APP_MT_ID_THROTTLE_VERIFICATION_SEND_WINDOW_SECONDS:3600}
          min-interval:
            seconds: ${APP_MT_ID_THROTTLE_VERIFICATION_SEND_MIN_INTERVAL_SECONDS:30}
        forgot-password:
          max-attempts: ${APP_MT_ID_THROTTLE_FORGOT_PASSWORD_MAX_ATTEMPTS:5}
          window:
            seconds: ${APP_MT_ID_THROTTLE_FORGOT_PASSWORD_WINDOW_SECONDS:3600}
          min-interval:
            seconds: ${APP_MT_ID_THROTTLE_FORGOT_PASSWORD_MIN_INTERVAL_SECONDS:30}
        login:
          max-attempts: ${APP_MT_ID_THROTTLE_LOGIN_MAX_ATTEMPTS:10}
          window:
            seconds: ${APP_MT_ID_THROTTLE_LOGIN_WINDOW_SECONDS:900}
          min-interval:
            seconds: ${APP_MT_ID_THROTTLE_LOGIN_MIN_INTERVAL_SECONDS:1}
          ip:
            max-attempts: ${APP_MT_ID_THROTTLE_LOGIN_IP_MAX_ATTEMPTS:30}
            window:
              seconds: ${APP_MT_ID_THROTTLE_LOGIN_IP_WINDOW_SECONDS:900}
            min-interval:
              seconds: ${APP_MT_ID_THROTTLE_LOGIN_IP_MIN_INTERVAL_SECONDS:1}
        application-token:
          max-attempts: ${APP_MT_ID_THROTTLE_APPLICATION_TOKEN_MAX_ATTEMPTS:10}
          window:
            seconds: ${APP_MT_ID_THROTTLE_APPLICATION_TOKEN_WINDOW_SECONDS:900}
          min-interval:
            seconds: ${APP_MT_ID_THROTTLE_APPLICATION_TOKEN_MIN_INTERVAL_SECONDS:1}
          ip:
            max-attempts: ${APP_MT_ID_THROTTLE_APPLICATION_TOKEN_IP_MAX_ATTEMPTS:30}
            window:
              seconds: ${APP_MT_ID_THROTTLE_APPLICATION_TOKEN_IP_WINDOW_SECONDS:900}
            min-interval:
              seconds: ${APP_MT_ID_THROTTLE_APPLICATION_TOKEN_IP_MIN_INTERVAL_SECONDS:1}
        address-lookup:
          max-attempts: ${APP_MT_ID_THROTTLE_ADDRESS_LOOKUP_MAX_ATTEMPTS:30}
          window:
            seconds: ${APP_MT_ID_THROTTLE_ADDRESS_LOOKUP_WINDOW_SECONDS:60}
          min-interval:
            seconds: ${APP_MT_ID_THROTTLE_ADDRESS_LOOKUP_MIN_INTERVAL_SECONDS:0}
      password:
        pwned:
          enabled: ${APP_MT_ID_PASSWORD_PWNED_ENABLED:true}
          fail-open: ${APP_MT_ID_PASSWORD_PWNED_FAIL_OPEN:true}
      google:
        jwks-url: ${APP_MT_ID_GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
        owner:
          audience: ${APP_MT_ID_GOOGLE_OWNER_AUDIENCE:298569807540-sg0r9rndj2i3n2sujr1sobp9nr4in59c.apps.googleusercontent.com}
        user:
          audience: ${APP_MT_ID_GOOGLE_USER_AUDIENCE:298569807540-sg0r9rndj2i3n2sujr1sobp9nr4in59c.apps.googleusercontent.com}
      token:
        expiration:
          minutes: ${APP_MT_ID_JWT_TOKEN_EXPIRATION_MINUTES:15}
      refresh-token:
        expiration:
          days: ${APP_MT_ID_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}